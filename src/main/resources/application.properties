spring.application.name=hotel-booking-system

# Business settings (see HotelProperties)
hotel.zone-id=Asia/Kolkata
hotel.check-in-hour=12
hotel.cancellation.full-refund-hours=48
hotel.cancellation.partial-refund-hours=24
hotel.cancellation.partial-refund-percent=50
# base | weekend-surcharge
hotel.pricing.strategy=base
hotel.pricing.weekend-surcharge-percent=20

spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.operationsSorter=method
